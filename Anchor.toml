# Do not start a local surfpool validator - default tests are Rust with LiteSVM
# If you want to manually run anchor test with ts-mocha, set skip_local_validator = false and comment out lines in [scripts]
skip_local_validator = true

[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
r3_session_keys = "r3xx1495USK8vysHAfL83d9seSofMH77ytxjuhepfFH"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"
# run tests with println logs
test-rust-logs = "cargo test -- --nocapture"
test-ts = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/0*.ts"


